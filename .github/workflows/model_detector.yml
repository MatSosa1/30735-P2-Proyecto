name: Check Vulnerabilities

on:
  pull_request:
    branches:
      - test

jobs:
  run-python:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Notificar inicio de revisión
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Inicio de revisión de seguridad*

            *Desarrollador:* ${{ github.actor }}
            *Repo:* ${{ github.repository }}
            *PR:* #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

            Analizando el código modificado con el modelo ML...
            [Ver PR](${{ github.event.pull_request.html_url }})

      - name: Revisar Vulnerabilidades Modelo IA
        id: classify
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python -m pipeline

      - name: Notificar resultado SEGURO
        if: steps.classify.outputs.result == 'SEGURO'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *Código SEGURO — Revisión aprobada*

            *Desarrollador:* ${{ github.actor }}
            *Repo:* ${{ github.repository }}
            *PR:* #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

            *Resultado:* SEGURO
            *Probabilidad de vulnerabilidad:* ${{ steps.classify.outputs.probability }}

            El pipeline continúa.
            [Ver PR](${{ github.event.pull_request.html_url }})

      - name: Notificar resultado VULNERABLE
        if: steps.classify.outputs.result == 'VULNERABLE'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *VULNERABILIDAD DETECTADA — PR Rechazado*

            *Desarrollador:* ${{ github.actor }}
            *Repo:* ${{ github.repository }}
            *PR:* #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}

            *Resultado:* VULNERABLE
            *Probabilidad:* ${{ steps.classify.outputs.probability }}
            *Tipo probable:* ${{ steps.classify.outputs.vuln_type }}
            *Archivo afectado:* `${{ steps.classify.outputs.file }}`

            El merge ha sido bloqueado automáticamente.
            Corrige el código y abre un nuevo PR.
            [Ver logs del run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Reportar vulnerabilidad (comentario, label e issue)
        if: steps.classify.outputs.result == 'VULNERABLE'
        uses: actions/github-script@v7
        env:
          PROB: ${{ steps.classify.outputs.probability }}
          VTYPE: ${{ steps.classify.outputs.vuln_type }}
          VFILE: ${{ steps.classify.outputs.file }}
        with:
          script: |
            const prob = process.env.PROB;
            const vtype = process.env.VTYPE;
            const vfile = process.env.VFILE;
            const actor = context.actor;
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            try {
              await github.rest.issues.createLabel({
                owner, repo, name: 'fixing-required', color: 'B60205',
                description: 'PR bloqueado: vulnerabilidad detectada por el modelo',
              });
            } catch (e) { /* la etiqueta ya existe */ }

            const comment = [
              '## Revisión de seguridad: VULNERABLE',
              '',
              'El modelo de minería de datos clasificó el código modificado como **VULNERABLE**. El merge ha sido bloqueado automáticamente.',
              '',
              '| Campo | Valor |',
              '|---|---|',
              '| **Resultado** | VULNERABLE |',
              `| **Probabilidad** | ${prob} |`,
              `| **Tipo probable** | ${vtype} |`,
              '| **Archivo afectado** | `' + vfile + '` |',
              `| **Desarrollador** | @${actor} |`,
              '',
              'Corrige la vulnerabilidad y vuelve a enviar los cambios.',
              `[Ver logs del análisis](${runUrl})`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner, repo, issue_number: prNumber, body: comment,
            });

            await github.rest.issues.addLabels({
              owner, repo, issue_number: prNumber, labels: ['fixing-required'],
            });

            await github.rest.issues.create({
              owner, repo,
              title: `[fixing-required] Vulnerabilidad en PR #${prNumber}: ${vtype}`,
              labels: ['fixing-required'],
              body: [
                `Issue generada automáticamente por la revisión de seguridad del PR #${prNumber}.`,
                '',
                `- **Tipo:** ${vtype}`,
                `- **Probabilidad:** ${prob}`,
                '- **Archivo:** `' + vfile + '`',
                `- **Desarrollador:** @${actor}`,
                '',
                `Relacionado con #${prNumber}`,
                '',
                `[Ver logs del análisis](${runUrl})`,
              ].join('\n'),
            });

      - name: Bloquear merge si es vulnerable
        if: steps.classify.outputs.result == 'VULNERABLE' || steps.classify.outcome == 'failure'
        run: |
          echo "Revisión de seguridad fallida: merge bloqueado."
          exit 1